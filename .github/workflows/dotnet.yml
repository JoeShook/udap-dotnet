# Builds and tests every branch and every pull request into main or develop.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore
      run: dotnet restore Udap.sln
    # Any package, direct or transitive, on any target framework, with a published advisory fails the build.
    # The Udap.* packages pass their dependencies on to every consumer.
    - name: Refuse vulnerable packages
      run: |
        dotnet list Udap.sln package --vulnerable --include-transitive | tee vulnerable.txt
        if grep -q "has the following vulnerable packages" vulnerable.txt; then
          echo "::error::Vulnerable packages found; update or pin them before merging."
          exit 1
        fi
    - name: Generate PKI
      run: dotnet test -c Release _tests/Udap.PKI.Generator/Udap.PKI.Generator.csproj
    - name: Build
      run: dotnet build -c Release Udap.sln
    # Udap.Common.Tests targets net8.0, net9.0 and net10.0, so it runs once per framework the libraries ship.
    - name: Test Udap.Common.Tests
      run: dotnet test -c Release _tests/Udap.Common.Tests/Udap.Common.Tests.csproj --no-build --verbosity normal
    - name: Test UdapMetadata.Tests
      run: dotnet test -c Release _tests/UdapMetadata.Tests/UdapMetadata.Tests.csproj --no-build --verbosity normal
    - name: Test UdapServer.Tests
      run: dotnet test -c Release _tests/UdapServer.Tests/UdapServer.Tests.csproj --no-build --verbosity normal

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore
      run: |
        dotnet tool restore
        dotnet restore Udap.sln
    # One CycloneDX BOM per published Udap.* package, listing the dependencies it brings to consumers,
    # including the other Udap.* packages it references. SourceLink is build-only and never reaches consumers.
    - name: Generate CycloneDX BOMs
      run: |
        for package in Udap.Model Udap.Util Udap.Common Udap.Metadata.Server Udap.Server Udap.Server.Storage \
                       Udap.Client Udap.UI Udap.Smart.Model Udap.Smart.Metadata Udap.CdsHooks.Endpoint \
                       Udap.CdsHooks.Model Udap.Tefca.Model Udap.Tefca.Server Udap.Ssraa.Server; do
          dotnet dotnet-CycloneDX "$package/$package.csproj" -o sbom -F Json -fn "$package.cdx.json" \
            --set-type Library --include-project-references --set-nuget-purl \
            --exclude-filter Microsoft.SourceLink.GitHub
        done
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom
        path: sbom
